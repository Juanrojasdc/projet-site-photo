<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/assets/css/contact-style.min.css" />
  </head>
  <body>
    <!-- Première section avec un tableau de réassurance avec des chiffres clés -->
    <section>
      <table class="table table-bordered text-center">
        <tbody>
          <tr>
            <td class="col-6 table-row">
              <span class="table--bold">15+</span><br />
              Ans à capturer vos émotions
            </td>
            <td class="col-6 table-row">
              <span class="table--bold">500+</span><br />
              Séances réalisées
            </td>
          </tr>

          <tr>
            <td class="col-6 table-row">
              <span class="table--bold">50 000+</span><br />
              Photos livrées
            </td>
            <td class="col-6 table-row">
              <span class="table--bold">100%</span><br />
              Passion
            </td>
          </tr>
        </tbody>
      </table>
    </section>
    <section class="bg-black px-4 py-5">
      <h2 class="text-light fs-4 fs-md-3 text-center">
        Et si nous écrivions votre histoire en images ?
      </h2>
      <h3 class="text-light fs-5 fs-md-4 text-center h3-italic">
        Parlez-moi de votre projet, je vous réponds sous 48h.
      </h3>
      <div class="row">
        <div class="col-12 col-md-6">
          <p class="text-light text-center">Derrière chaque photo, une rencontre.</p>
        </div>
        <div class="col text-light">
          <form class="row g-3">
            <div class="col">
              <label class="visually-hidden" for="autoSizingSelect">Preference</label>
              <select class="form-select" id="autoSizingSelect">
                <option selected>Type de prestation</option>
                <option value="1">Mariage</option>
                <option value="2">Maternité</option>
                <option value="3">Portraits</option>
                <option value="4">Animalier</option>
                <option value="5">Corporate</option>
              </select>
            </div>
            <div class="col-12">
              <div class="row g-0">
                <div class="col-6">
                  <label class="form-label">Date de début</label>
                  <input type="date" class="form-control rounded-start rounded-end-0" />
                </div>
                <div class="col-6">
                  <label class="form-label">Date de fin</label>
                  <input type="date" class="form-control rounded-start-0 rounded-end" />
                </div>
                <div class="col">
                  <label class="form-label">Budget</label>
                  <input type="number" class="form-control" placeholder="" />
                </div>
              </div>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-primary rounded-0 w-100 text-black">
                C'est bientôt fini
              </button>
            </div>
          </form>
        </div>
      </div>
    </section>
    <section class="py-5">
      <h2 class="fs-4 fs-md-3 text-center">À leurs côtés, appareil en main.</h2>
    </section>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
