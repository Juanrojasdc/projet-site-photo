<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galerie</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="/assets/css/buttons-galerie-style.min.css" />
  </head>
  <body>
    <section class="bg-black py-5 px-4">
      <h3 class="text-center text-light py-5">Des instants vrais et spontannés</h3>
      <div class="bento-container pb-5">
        <div class="row g-3">
          <!-- Grande image verticale à gauche -->
          <div class="col-12 col-md-3">
            <div class="bento-item bento-vertical">
              <img src="/assets/img/mariage/mariage-13.webp" alt="" />
            </div>
          </div>

          <!-- Colonne droite -->
          <div class="col-md-9">
            <div class="row g-3">
              <!-- Ligne 1 : petite + large -->
              <div class="col-6 col-md-4">
                <div class="bento-item bento-small">
                  <img src="/assets/img/portrait/portrait-2.webp" alt="" />
                </div>
              </div>
              <div class="col-6 col-md-8">
                <div class="bento-item bento-small">
                  <img src="/assets/img/mariage/mariage-12.webp" alt="" />
                </div>
              </div>

              <!-- Ligne 2 : 3 petites -->
              <div class="col-md-4 d-none d-md-block">
                <div class="bento-item bento-small">
                  <img src="/assets/img/animalier/canin-16.webp" alt="" />
                </div>
              </div>
              <div class="col-md-4 d-none d-md-block">
                <div class="bento-item bento-small">
                  <img src="/assets/img/animalier/equin-1.webp" alt="" />
                </div>
              </div>
              <div class="col-md-4 d-none d-md-block">
                <div class="bento-item bento-small">
                  <img src="/assets/img/portrait/portrait-7.webp" alt="" />
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col d-flex justify-content-center justify-content-md-start">
          <button type="button" class="btn btn-outline-light rounded-0 p-3 mt-5">
            EN DECOUVRIR D'AVANTAGE
          </button>
        </div>
      </div>
    </section>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
