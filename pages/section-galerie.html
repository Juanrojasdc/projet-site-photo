<section class="bg-black py-5 px-4 page-galerie">

          <div class="col-6 col-md-8">

          <div class="col-md-4 d-none d-md-block">

              />
            </div>
          </div>
          <div class="col-md-4 d-none d-md-block">
            <div
              class="bento-item bento-small menu__card"
              data-bs-toggle="modal"
              data-bs-target="#modal-equin-1"
              style="cursor: pointer"
            >
              <img
                src="./assets/img/animalier/equin-1.webp"

              />
            </div>
          </div>
          <div class="col-md-4 d-none d-md-block">
            <div
              class="bento-item bento-small menu__card"
              data-bs-toggle="modal"
              data-bs-target="#modal-g-portrait-7"
              style="cursor: pointer"
            >
              <img
                src="./assets/img/portrait/portrait-7.webp"
                alt="Portrait d'une jeune femme aux longs cheveux ondulés, photographiée en lumière dorée en bord de mer"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col d-flex justify-content-center justify-content-md-start">
      <a href="./pages/prestations.html">
        <button type="button" class="btn btn-outline-light rounded-0 p-3 mt-5">
          EN DECOUVRIR D'AVANTAGE
        </button>
      </a>
    </div>
  </div>
</section>
