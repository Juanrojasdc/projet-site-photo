<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Illustration-de-contact</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../assets/css/illustration-de-contact.min.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <section class="illustration-contact container-fluid p-0">
      <img
        src="../assets/img/contact__image.png"
        class="illustration-contact__image"
        alt="Une famille regardant le coucher du soleil sur la plage"
      />

      <div class="illustration-contact__card text-center">
        <h2>Votre histoire mérite d'être racontée.</h2>

        <p class="illustration-contact__description fw-normal fst-normal text-center mb-0">
          Chaque séance est une expérience unique pour créer<br />
          des souvenirs vrais, lumineux et intemporels.
        </p>

        <a href="./galerie.html" class="btn illustration-contact__button">
          Découvrir mon travail
        </a>
      </div>
    </section>
  </body>
</html>
