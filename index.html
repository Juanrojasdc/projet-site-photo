<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Description professionnelle du projet pour le SEO" />
    <meta name="theme-color" content="#ffffff" />

    <title>LA photografie33</title>

    <!-- 1. Google Fonts (Préconnexion pour les performances) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- 2. Bootstrap 5 CSS (CDN) -->

  <body>
    <!-- Ici viendra l'intégration de la maquette -->
    <h1 class="text-center mt-5">Environnement Prêt</h1>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

    <!-- 3. JS Local (Doit être placé à la fin pour pouvoir sélectionner les éléments du DOM et utiliser GSAP) -->
    <script src="./assets/js/main.js"></script>
